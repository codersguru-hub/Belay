<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Belay">
  <title>Belay</title>
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131f38"/>
      <stop offset="100%" stop-color="#060b16"/>
    </linearGradient>
    <linearGradient id="ropeB" gradientUnits="userSpaceOnUse" x1="30" y1="24" x2="134" y2="182">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="edgeB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bgB)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#edgeB)" stroke-width="4"/>
  <g transform="translate(92,50) scale(2)">
    <!-- load line: taut, enters BEHIND the ring wall -->
    <path d="M 30 24 L 104 96" fill="none" stroke="url(#ropeB)" stroke-width="16" stroke-linecap="round"/>
    <!-- the ring: the control plane the line runs through -->
    <rect x="74" y="46" width="54" height="112" rx="27" fill="none" stroke="#7c8aa0" stroke-width="16"/>
    <!-- brake line: exits IN FRONT, curving under control -->
    <path d="M 104 96 C 132 122 134 152 112 168 C 94 181 66 174 46 182" fill="none" stroke="url(#ropeB)" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
