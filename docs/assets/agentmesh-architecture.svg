<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AgentMesh trust-zone architecture</title>
  <desc id="desc">Independent agents connect to a local control plane and secret-free cockpit. Only validated structural metadata reaches private Cloud Run and Gemini.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#8b949e"/></marker>
    <style>
      .bg{fill:#0d1117}.zone{fill:#161b22;stroke:#30363d;stroke-width:2}.node{stroke-width:2}.local{fill:#172235;stroke:#58a6ff}.secure{fill:#2a2116;stroke:#d29922}.cloud{fill:#15271d;stroke:#3fb950}.title{fill:#f0f6fc;font:700 25px Arial}.zoneTitle{fill:#8b949e;font:600 15px monospace;letter-spacing:1px}.label{fill:#f0f6fc;font:600 17px Arial}.small{fill:#8b949e;font:13px monospace}.edge{fill:none;stroke:#8b949e;stroke-width:2;marker-end:url(#arrow)}.allow{stroke:#3fb950}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <text class="title" x="48" y="52">AgentMesh · Local-First Agent Control Plane</text>
  <rect class="zone" x="40" y="88" width="250" height="748" rx="14"/><text class="zoneTitle" x="64" y="122">A · AGENT CLIENTS</text>
  <rect class="zone" x="320" y="88" width="650" height="748" rx="14"/><text class="zoneTitle" x="344" y="122">B · LOCAL CONTROL PLANE</text>
  <rect class="zone" x="1000" y="88" width="400" height="350" rx="14"/><text class="zoneTitle" x="1024" y="122">C · HUMAN COCKPIT</text>
  <rect class="zone" x="1000" y="468" width="400" height="368" rx="14"/><text class="zoneTitle" x="1024" y="502">D · CLOUD INTELLIGENCE</text>
  <g class="node local"><rect x="70" y="174" width="190" height="76" rx="10"/><rect x="70" y="294" width="190" height="76" rx="10"/><rect x="70" y="414" width="190" height="76" rx="10"/></g>
  <text class="label" x="165" y="207" text-anchor="middle">Claude Code</text><text class="small" x="165" y="229" text-anchor="middle">independent caller</text>
  <text class="label" x="165" y="327" text-anchor="middle">OpenAI Codex</text><text class="small" x="165" y="349" text-anchor="middle">independent caller</text>
  <text class="label" x="165" y="447" text-anchor="middle">Antigravity</text><text class="small" x="165" y="469" text-anchor="middle">independent caller</text>
  <g class="node local"><rect x="360" y="160" width="250" height="82" rx="10"/><rect x="670" y="160" width="250" height="82" rx="10"/><rect x="360" y="292" width="250" height="82" rx="10"/><rect x="670" y="292" width="250" height="82" rx="10"/></g>
  <g class="node secure"><rect x="360" y="424" width="250" height="82" rx="10"/><rect x="670" y="424" width="250" height="82" rx="10"/><rect x="360" y="556" width="250" height="82" rx="10"/><rect x="670" y="556" width="250" height="82" rx="10"/></g>
  <rect class="node local" x="515" y="694" width="250" height="82" rx="10"/>
  <text class="label" x="485" y="194" text-anchor="middle">MCP Streamable HTTP</text><text class="small" x="485" y="218" text-anchor="middle">127.0.0.1 only</text>
  <text class="label" x="795" y="194" text-anchor="middle">Coordination</text><text class="small" x="795" y="218" text-anchor="middle">tasks · leases · memory</text>
  <text class="label" x="485" y="326" text-anchor="middle">Deterministic indexer</text><text class="small" x="485" y="350" text-anchor="middle">bounded manifest</text>
  <text class="label" x="795" y="326" text-anchor="middle">SQLite WAL</text><text class="small" x="795" y="350" text-anchor="middle">metadata only</text>
  <text class="label" x="485" y="458" text-anchor="middle">Vault</text><text class="small" x="485" y="482" text-anchor="middle">AES-GCM + age unwrap</text>
  <text class="label" x="795" y="458" text-anchor="middle">Policy + approvals</text><text class="small" x="795" y="482" text-anchor="middle">single-use digest</text>
  <text class="label" x="485" y="590" text-anchor="middle">Registered executor</text><text class="small" x="485" y="614" text-anchor="middle">shell false · redacted</text>
  <text class="label" x="795" y="590" text-anchor="middle">Egress guard</text><text class="small" x="795" y="614" text-anchor="middle">exact schema · fail closed</text>
  <text class="label" x="640" y="728" text-anchor="middle">Sanitized audit</text><text class="small" x="640" y="752" text-anchor="middle">correlation IDs · no values</text>
  <rect class="node local" x="1040" y="168" width="320" height="118" rx="10"/><text class="label" x="1200" y="211" text-anchor="middle">React cockpit</text><text class="small" x="1200" y="237" text-anchor="middle">masked REST + WebSocket</text><text class="small" x="1200" y="260" text-anchor="middle">human approval authority</text>
  <rect class="node cloud" x="1040" y="548" width="320" height="92" rx="10"/><text class="label" x="1200" y="583" text-anchor="middle">Private Cloud Run</text><text class="small" x="1200" y="610" text-anchor="middle">server-side revalidation</text>
  <rect class="node cloud" x="1040" y="690" width="320" height="92" rx="10"/><text class="label" x="1200" y="725" text-anchor="middle">Genkit + Gemini</text><text class="small" x="1200" y="752" text-anchor="middle">advisory structured output</text>
  <path class="edge" d="M260 212h90M260 332h90M260 452h90M610 201h50M485 242v40M795 242v40M610 333h50M795 374v40M610 465h50M485 506v40M795 506v40M640 638v46M970 227h60M970 735h50V278h10"/>
  <path class="edge allow" d="M920 597h110M1200 640v40"/><text class="small" x="975" y="581" text-anchor="middle">allowlisted only</text>
  <path class="edge" d="M1040 736h-50V336h-20"/>
  <text class="small" x="40" y="872">Secrets, private keys, raw connection strings, and complete source never cross the cloud boundary.</text>
</svg>
