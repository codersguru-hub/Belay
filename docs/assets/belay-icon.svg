<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Belay">
  <title>Belay</title>
  <defs>
    <linearGradient id="belayRope" gradientUnits="userSpaceOnUse" x1="30" y1="24" x2="134" y2="182">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <g>
    <!-- load line: taut, enters BEHIND the ring wall -->
    <path d="M 30 24 L 104 96" fill="none" stroke="url(#belayRope)" stroke-width="16" stroke-linecap="round"/>
    <!-- the ring: the control plane the line runs through -->
    <rect x="74" y="46" width="54" height="112" rx="27" fill="none" stroke="#64748b" stroke-width="16"/>
    <!-- brake line: exits IN FRONT, curving under control -->
    <path d="M 104 96 C 132 122 134 152 112 168 C 94 181 66 174 46 182" fill="none" stroke="url(#belayRope)" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
